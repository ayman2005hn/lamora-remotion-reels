name: Render Lamora Reel (Remotion Ultra-HD)

on:
  workflow_dispatch:
    inputs:
      props_json:
        description: 'JSON props for LamoraBenchReel'
        required: false
        default: '{}'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render Remotion 9:16 Reel (1080x1920 @ 30fps)
        run: |
          mkdir -p out
          npx remotion render src/index.ts LamoraBenchReel out/lamora-reel.mp4 --props='${{ github.event.inputs.props_json }}'

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamora-rendered-reel
          path: out/lamora-reel.mp4
          retention-days: 3
